<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 활동 카드 16장</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f0;
    --white: #ffffff;
    --ink: #111111;
    --ink-soft: #444444;
    --ink-muted: #999999;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 64px 32px 80px;
  }
  .header { text-align: center; margin-bottom: 16px; }
  .header-badge {
    display: inline-block;
    background: var(--ink); color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px; letter-spacing: 4px;
    padding: 5px 14px; border-radius: 4px; margin-bottom: 20px;
  }
  .header-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(48px, 8vw, 96px);
    letter-spacing: -3px; line-height: 0.95;
    color: var(--ink); margin-bottom: 12px;
  }
  .header-title span {
    display: inline-block;
    background: var(--ink); color: #fff;
    padding: 0 12px 4px; border-radius: 8px;
  }
  .header-sub { font-size: 13px; color: var(--ink-muted); letter-spacing: 2px; margin-bottom: 48px; }
  .legend { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 52px; }
  .legend-chip {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 700; color: var(--ink);
    background: var(--white); border: 2px solid var(--ink);
    border-radius: 30px; padding: 5px 14px; cursor: pointer;
    transition: background 0.15s;
  }
  .legend-chip:hover { background: var(--ink); color: #fff; }
  .legend-chip.active { background: var(--ink); color: #fff; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 18px; max-width: 1300px; margin: 0 auto;
  }
  .card {
    background: var(--white);
    border: 2.5px solid var(--ink);
    border-radius: 20px; overflow: hidden;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-5px) rotate(-0.4deg);
    box-shadow: 6px 10px 0 var(--ink);
  }
  .card.hidden { display: none; }
  .card-head {
    padding: 18px 22px 16px;
    border-bottom: 2.5px solid var(--ink);
    position: relative;
  }
  .card-num { font-family: 'Bebas Neue', sans-serif; font-size: 11px; letter-spacing: 3px; color: var(--ink-muted); margin-bottom: 4px; }
  .card-type { font-family: 'Bebas Neue', sans-serif; font-size: 44px; letter-spacing: 4px; line-height: 1; }
  .card-name { font-family: 'Black Han Sans', sans-serif; font-size: 13px; color: var(--ink-soft); margin-top: 5px; }
  .card-badge {
    position: absolute; top: 16px; right: 16px;
    width: 40px; height: 40px; border-radius: 10px;
    border: 2px solid var(--ink);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .card-body { padding: 16px 22px 16px; }
  .card-goal { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 11px; }
  .card-quote {
    border-radius: 10px; border: 2px solid var(--ink);
    padding: 10px 13px; font-size: 13px; font-weight: 900;
    color: var(--ink); line-height: 1.45; margin-bottom: 14px;
  }
  .card-game {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700;
    border-radius: 30px; padding: 5px 12px;
    border: 2px solid var(--ink);
  }
  .card-actions {
    display: flex; gap: 8px;
    padding: 0 22px 18px;
  }
  .btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 10px; border-radius: 10px;
    border: 2px solid var(--ink);
    font-size: 11px; font-weight: 700;
    cursor: pointer; transition: background 0.15s, color 0.15s;
    background: var(--white); color: var(--ink);
    text-decoration: none;
  }
  .btn:hover { background: var(--ink); color: #fff; }
  .btn.playing { color: #fff; }
  .card-watermark {
    position: absolute; bottom: -4px; right: 14px;
    font-family: 'Bebas Neue', sans-serif; font-size: 80px; line-height: 1;
    opacity: 0.05; pointer-events: none; user-select: none; color: var(--ink);
  }
  .analyst  .card-head { background: #eef2ff; }
  .analyst  .card-type { color: #4f46e5; }
  .analyst  .card-badge { background: #c7d2fe; }
  .analyst  .card-game  { background: #c7d2fe; }
  .analyst  .btn.playing { background: #4f46e5; border-color: #4f46e5; }
  .diplomat .card-head { background: #ecfdf5; }
  .diplomat .card-type { color: #059669; }
  .diplomat .card-badge { background: #a7f3d0; }
  .diplomat .card-game  { background: #a7f3d0; }
  .diplomat .btn.playing { background: #059669; border-color: #059669; }
  .sentinel .card-head { background: #fef2f2; }
  .sentinel .card-type { color: #dc2626; }
  .sentinel .card-badge { background: #fecaca; }
  .sentinel .card-game  { background: #fecaca; }
  .sentinel .btn.playing { background: #dc2626; border-color: #dc2626; }
  .explorer .card-head { background: #fffbeb; }
  .explorer .card-type { color: #d97706; }
  .explorer .card-badge { background: #fde68a; }
  .explorer .card-game  { background: #fde68a; }
  .explorer .btn.playing { background: #d97706; border-color: #d97706; }
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.55); z-index: 100;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--white);
    border: 2.5px solid var(--ink);
    border-radius: 24px; max-width: 420px; width: 100%;
    overflow: hidden; position: relative;
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn { from { transform: scale(0.92) translateY(12px); opacity:0; } to { transform: none; opacity:1; } }
  .modal-head { padding: 24px 28px 20px; border-bottom: 2px solid var(--ink); position: relative; }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--ink); background: var(--white);
    cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .modal-close:hover { background: var(--ink); color: #fff; }
  .modal-num { font-family: 'Bebas Neue', sans-serif; font-size: 11px; letter-spacing: 3px; color: var(--ink-muted); margin-bottom: 4px; }
  .modal-type { font-family: 'Bebas Neue', sans-serif; font-size: 52px; letter-spacing: 4px; line-height: 1; }
  .modal-name { font-family: 'Black Han Sans', sans-serif; font-size: 15px; color: var(--ink-soft); margin-top: 6px; }
  .modal-body { padding: 20px 28px 24px; }
  .modal-desc { font-size: 13px; line-height: 1.7; color: var(--ink-soft); margin-bottom: 20px; }
  .modal-section { margin-bottom: 16px; }
  .modal-section-label {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    color: var(--ink-muted); margin-bottom: 8px; text-transform: uppercase;
  }
  .audio-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); border-radius: 10px;
    border: 2px solid var(--ink); padding: 10px 14px;
    margin-bottom: 8px;
  }
  .audio-play-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--ink); background: var(--white);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; transition: background 0.15s;
  }
  .audio-play-btn:hover, .audio-play-btn.active { background: var(--ink); color: #fff; }
  .audio-label { font-size: 12px; font-weight: 700; flex: 1; }
  .audio-duration { font-size: 11px; color: var(--ink-muted); font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }
  .progress-bar {
    width: 100%; height: 4px; background: #e5e7eb;
    border-radius: 2px; margin-top: 6px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 2px;
    transition: width 0.1s linear;
  }
  .modal-dl-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px;
    border-radius: 12px; border: 2px solid var(--ink);
    background: var(--white); color: var(--ink);
    font-size: 13px; font-weight: 700; cursor: pointer;
    text-decoration: none; transition: background 0.15s, color 0.15s;
  }
  .modal-dl-btn:hover { background: var(--ink); color: #fff; }
  .footer {
    text-align: center; margin-top: 64px;
    font-family: 'Bebas Neue', sans-serif; font-size: 12px;
    letter-spacing: 4px; color: var(--ink-muted);
  }
  @media (max-width: 600px) {
    body { padding: 40px 14px 60px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .card-head { padding: 14px 14px 12px; }
    .card-body { padding: 12px 14px 12px; }
    .card-actions { padding: 0 14px 14px; }
    .card-type { font-size: 30px; }
    .card-badge { display: none; }
  }
  @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">ENGLISH CLASS ACTIVITY</div>
  <h1 class="header-title">MBTI<br><span>활동 카드</span></h1>
  <p class="header-sub">16 TYPES · 16 MISSIONS · 1 CLASS</p>
</div>

<div class="legend">
  <div class="legend-chip active" data-filter="all"><div class="legend-dot" style="background:#111"></div>전체</div>
  <div class="legend-chip" data-filter="analyst"><div class="legend-dot" style="background:#4f46e5"></div>분석가 NT</div>
  <div class="legend-chip" data-filter="diplomat"><div class="legend-dot" style="background:#059669"></div>외교관 NF</div>
  <div class="legend-chip" data-filter="sentinel"><div class="legend-dot" style="background:#dc2626"></div>관리자 SJ</div>
  <div class="legend-chip" data-filter="explorer"><div class="legend-dot" style="background:#d97706"></div>탐험가 SP</div>
</div>

<div class="grid" id="cardGrid"></div>
<div class="footer">MBTI ACTIVITY CARD SYSTEM · 16 TYPES</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-head" id="modalHead">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-num" id="modalNum"></div>
      <div class="modal-type" id="modalType"></div>
      <div class="modal-name" id="modalName"></div>
    </div>
    <div class="modal-body">
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-section">
        <div class="modal-section-label">🎵 BGM</div>
        <div class="audio-row" id="bgmRow">
          <button class="audio-play-btn" id="bgmBtn">▶</button>
          <div style="flex:1">
            <div class="audio-label" id="bgmLabel">BGM</div>
            <div class="progress-bar"><div class="progress-fill" id="bgmProgress"></div></div>
          </div>
          <div class="audio-duration" id="bgmDuration">--:--</div>
        </div>
        <div class="audio-row" id="instrRow">
          <button class="audio-play-btn" id="instrBtn">▶</button>
          <div style="flex:1">
            <div class="audio-label">안내 음성</div>
            <div class="progress-bar"><div class="progress-fill" id="instrProgress"></div></div>
          </div>
          <div class="audio-duration" id="instrDuration">--:--</div>
        </div>
      </div>
      <div class="modal-section">
        <div class="modal-section-label">📄 교구 다운로드</div>
        <a class="modal-dl-btn" id="modalDlBtn" href="#" download>⬇ PDF 교구 다운로드</a>
      </div>
    </div>
  </div>
</div>

<script>
const BASE = 'https://raw.githubusercontent.com/uhoooo86-creative-droid/MBTI-Bigcat-Teacher/main/';

const cards = [
  {id:1, type:"INTJ",group:"analyst", emoji:"🎯",name:"격파 미션 카드",      goal:"단계형 전략 수업",  quote:"Step 1 clear! Next mission!", game:"격파 뒤 단어 꺼내기",    description:"단계별 미션을 완료하며 목표 어휘를 학습합니다.",                                                             audio:"assets/audio/Mission-Breaker_BGM.mp3",               pdf:"assets/pdf/Mission-Breaker.pdf"},
  {id:2, type:"INTP",group:"analyst", emoji:"🧩",name:"Why vs Because 카드",goal:"질문-이유 구조",    quote:"Why? → Because!",            game:"Why team vs Because team",description:"묻고 답하며 친구와 상호작용합니다.",                                                                          audio:"assets/audio/Why-vs-Because_BGM.mp3",                pdf:"assets/pdf/Why-vs-Because.pdf"},
  {id:3, type:"ENTJ",group:"analyst", emoji:"❗", name:"문장 부호 리더 카드",goal:"역할 기반 참여",   quote:"This is a question!",        game:"❗❓ 역할 팀 미션",         description:"문장 부호를 역할로 정하여 문장을 완성합니다.",                                                                audio:"assets/audio/Punctuation-Leader_BGM.mp3",            pdf:"assets/pdf/Punctuation-Leader.pdf"},
  {id:4, type:"ENTP",group:"analyst", emoji:"💡",name:"아인슈타인 카드",      goal:"규칙 변화 & 창의성",quote:"Wait! I have an idea!",       game:"CVC 릴레이 + 규칙 변경",  description:"Go & Stop, 허수아비와 같은 형식으로 게임을 통해 어휘를 자연스럽게 익힙니다.",                                audio:"assets/audio/Einstein_BGM.mp3",                      pdf:"assets/pdf/Einstein.pdf"},
  {id:5, type:"INFJ",group:"diplomat",emoji:"🎬",name:"오스카상 카드",        goal:"몰입 역할극",       quote:"You are the main character!",game:"오스카상 역할 미션",       description:"목표 문장에 감정을 넣어 자연스럽게 표현합니다.",                                                              audio:"assets/audio/Oscar_BGM.mp3",                         pdf:"assets/pdf/Oscar.pdf"},
  {id:6, type:"INFP",group:"diplomat",emoji:"✨",name:"Copy Me 카드",          goal:"창의 표현",         quote:"Show me your way!",          game:"단어 동작 만들기",          description:"다양한 동물을 따라 표현해보고 자신만의 동작으로 표현하기도 하고 친구들의 동작을 따라합니다.",              audio:"assets/audio/Copy-Me_BGM.mp3",                       pdf:"assets/pdf/Copy-Me.pdf"},
  {id:7, type:"ENFJ",group:"diplomat",emoji:"🤝",name:"마칭 팀워크 카드",      goal:"협력 발화",         quote:"Let's do it together!",      game:"2인3각 / 5인6각",           description:"팀원과 호흡을 맞춰 함께 발화하며 이동하는 협력형 활동입니다.",                                               audio:"assets/audio/Line_Up_Teamwork_BGM.mp3",              pdf:"assets/pdf/Line_Up_Teamwork.pdf"},
  {id:8, type:"ENFP",group:"diplomat",emoji:"🔥",name:"Better than Me 카드",  goal:"에너지 확장",        quote:"Better than me!",            game:"리액션 업 챌린지",          description:"가위바위보를 한 뒤 이긴 유아가 선택한 동작카드를 보고 목표어휘를 모두 외친 뒤 동일한 포즈를 취합니다.", audio:"assets/audio/Rock-Scissor-Paper-GoogooGaga_BGM.mp3", pdf:"assets/pdf/Rock-Scissor-Paper-GoogooGaga.pdf"},
  {id:9, type:"ISTJ",group:"sentinel",emoji:"🤫",name:"Whisper 카드",          goal:"정확 전달",          quote:"Listen carefully…",          game:"Whisper and Say",          description:"귓속말로 정확하게 단어를 전달하는 집중력 훈련입니다.",                                                       audio:"assets/audio/Whisper_BGM.mp3",                       pdf:"assets/pdf/Whisper.pdf"},
  {id:10,type:"ISFJ",group:"sentinel",emoji:"🌊",name:"중력 카드",             goal:"속도 조절",          quote:"Slow… slower…",              game:"중력 vs 무중력",            description:"중력과 무중력을 번갈아 경험하며 발음 리듬을 훈련합니다.",                                                   audio:"assets/audio/Gravity_BGM.mp3",                       pdf:"assets/pdf/Gravity.pdf"},
  {id:11,type:"ESTJ",group:"sentinel",emoji:"📋",name:"룰 마스터 카드",        goal:"규칙 & 통제",        quote:"Boss says!",                  game:"Push the Button",          description:"버튼을 활용하여 방향, 신체 관련 어휘를 익힙니다.",                                                          audio:"assets/audio/Button-Master_BGM.mp3",                 pdf:"assets/pdf/Button-Master.pdf"},
  {id:12,type:"ESFJ",group:"sentinel",emoji:"👏",name:"Good Job 카드",         goal:"칭찬 & 분위기",      quote:"Oh~ Oh~ Oh~ Good job!!",      game:"박수 챈트",                 description:"서로 칭찬과 응원해주며 긍정적인 상호작용을 합니다.",                                                       audio:"assets/audio/Good-Job_BGM.mp3",                      pdf:"assets/pdf/Good-Job.pdf"},
  {id:13,type:"ISTP",group:"explorer",emoji:"✋",name:"파트너 카드",           goal:"촉각 체험",          quote:"Feel and guess!",            game:"손바닥 쓰기",               description:"파트너 손바닥에 단어를 써서 맞추는 촉각 활동입니다.",                                                     audio:"assets/audio/Patner-Feel and guess_BGM.mp3",         pdf:"assets/pdf/Partner-Feel_and_guess.pdf"},
  {id:14,type:"ISFP",group:"explorer",emoji:"🎵",name:"감정선 카드",           goal:"감정 표현",          quote:"Feel it and move!",          game:"선 따라 이동",              description:"감정의 흐름에 따라 공간을 이동하며 발화하는 활동입니다.",                                                 audio:"assets/audio/Emotion-Doodle_BGM.mp3",                pdf:"assets/pdf/Emotion-Doodle.pdf"},
  {id:15,type:"ESTP",group:"explorer",emoji:"🏁",name:"레이스 카드",           goal:"속도 경쟁",          quote:"Ready, Set, Go!!",            game:"발화 후 레이스",            description:"CVC활동, 한 글자 혹은 어절씩 번갈아가며 발화하는 게임활동입니다.",                                         audio:"assets/audio/Word-Race_BGM.mp3",                     pdf:"assets/pdf/Word-Race.pdf"},
  {id:16,type:"ESFP",group:"explorer",emoji:"🎉",name:"세레모니 카드",         goal:"퍼포먼스",            quote:"Show your moment!",          game:"골 세레모니",               description:"발화 성공 후 자신만의 골 세레모니를 펼치는 활동입니다.",                                                  audio:"assets/audio/Ceremony_BGM.mp3",                      pdf:"assets/pdf/Ceremony.pdf"},
];

const groupLabel = {analyst:"분석가 NT",diplomat:"외교관 NF",sentinel:"관리자 SJ",explorer:"탐험가 SP"};

const grid = document.getElementById('cardGrid');
cards.forEach(c => {
  const el = document.createElement('div');
  el.className = `card ${c.group}`;
  el.dataset.group = c.group;
  el.innerHTML = `
    <div class="card-head">
      <div class="card-num">NO.${String(c.id).padStart(2,'0')} · ${groupLabel[c.group]}</div>
      <div class="card-type">${c.type}</div>
      <div class="card-name">${c.name}</div>
      <div class="card-badge">${c.emoji}</div>
    </div>
    <div class="card-body">
      <div class="card-goal">🎯 ${c.goal}</div>
      <div class="card-quote">${c.quote}</div>
      <div class="card-game">🎮 ${c.game}</div>
    </div>
    <div class="card-actions">
      <button class="btn" onclick="openModal(${c.id}, event)">🎵 음원 듣기</button>
      <a class="btn" href="${BASE + c.pdf}" download onclick="event.stopPropagation()">⬇ 교구</a>
    </div>
    <div class="card-watermark">${c.id}</div>
  `;
  el.addEventListener('click', () => openModal(c.id));
  grid.appendChild(el);
});

document.querySelectorAll('.legend-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.legend-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    const f = chip.dataset.filter;
    document.querySelectorAll('.card').forEach(card => {
      card.classList.toggle('hidden', f !== 'all' && card.dataset.group !== f);
    });
  });
});

let bgmAudio = null, instrAudio = null;

function fmtTime(s) {
  if (!s || isNaN(s)) return '--:--';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function setupAudio(audioEl, btn, progressEl, durationEl) {
  audioEl.addEventListener('loadedmetadata', () => {
    durationEl.textContent = fmtTime(audioEl.duration);
  });
  audioEl.addEventListener('timeupdate', () => {
    if (audioEl.duration) {
      progressEl.style.width = (audioEl.currentTime / audioEl.duration * 100) + '%';
    }
  });
  audioEl.addEventListener('ended', () => {
    btn.textContent = '▶';
    btn.classList.remove('active');
    progressEl.style.width = '0%';
  });
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (audioEl.paused) {
      if (audioEl === bgmAudio && instrAudio && !instrAudio.paused) { instrAudio.pause(); instrBtn.textContent='▶'; instrBtn.classList.remove('active'); }
      if (audioEl === instrAudio && bgmAudio && !bgmAudio.paused) { bgmAudio.pause(); bgmBtn.textContent='▶'; bgmBtn.classList.remove('active'); }
      audioEl.play().catch(()=>{ alert('음원 파일을 불러올 수 없습니다.'); });
      btn.textContent = '⏸';
      btn.classList.add('active');
    } else {
      audioEl.pause();
      btn.textContent = '▶';
      btn.classList.remove('active');
    }
  });
}

const overlay = document.getElementById('modalOverlay');
const modal   = document.getElementById('modal');
const bgmBtn  = document.getElementById('bgmBtn');
const instrBtn= document.getElementById('instrBtn');

let currentCard = null;

function openModal(id, e) {
  if (e) e.stopPropagation();
  const c = cards.find(x => x.id === id);
  if (!c) return;
  currentCard = c;

  if (bgmAudio)   { bgmAudio.pause(); bgmAudio.src = ''; }
  if (instrAudio) { instrAudio.pause(); instrAudio.src = ''; }
  bgmBtn.textContent = '▶'; bgmBtn.classList.remove('active');
  instrBtn.textContent = '▶'; instrBtn.classList.remove('active');
  document.getElementById('bgmProgress').style.width = '0%';
  document.getElementById('instrProgress').style.width = '0%';
  document.getElementById('bgmDuration').textContent = '--:--';
  document.getElementById('instrDuration').textContent = '--:--';

  const colors = {analyst:'#4f46e5',diplomat:'#059669',sentinel:'#dc2626',explorer:'#d97706'};
  const bgs    = {analyst:'#eef2ff',diplomat:'#ecfdf5',sentinel:'#fef2f2',explorer:'#fffbeb'};
  document.getElementById('modalHead').style.background = bgs[c.group];
  document.getElementById('modalNum').textContent = `NO.${String(c.id).padStart(2,'0')} · ${groupLabel[c.group]}`;
  document.getElementById('modalType').textContent = c.type;
  document.getElementById('modalType').style.color = colors[c.group];
  document.getElementById('modalName').textContent = c.name;
  document.getElementById('modalDesc').textContent = c.description;
  document.getElementById('bgmLabel').textContent = `🎵 ${c.name}`;
  document.getElementById('modalDlBtn').href = BASE + c.pdf;
  document.getElementById('modalDlBtn').download = `${c.name}.pdf`;
  document.getElementById('modalDlBtn').textContent = `⬇ ${c.name} 교구 다운로드`;

  document.getElementById('bgmProgress').style.background = colors[c.group];
  document.getElementById('instrProgress').style.background = colors[c.group];

  bgmAudio = new Audio(encodeURI(BASE + c.audio));
  instrAudio = null;
  document.getElementById('instrRow').style.display = 'none';
  setupAudio(bgmAudio, bgmBtn, document.getElementById('bgmProgress'), document.getElementById('bgmDuration'));

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  if (bgmAudio)   { bgmAudio.pause(); bgmAudio.src = ''; }
  if (instrAudio) { instrAudio.pause(); instrAudio.src = ''; }
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
